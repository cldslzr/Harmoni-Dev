[workspace]
channels = ["conda-forge"]
name = "harmoni-dev"
platforms = [
    "linux-64",
    { name="linux-64-cuda", platform = "linux-64", cuda = "12"}
    ]

[activation]
scripts = ["env.sh"]

[feature.gpu]
platforms = ["linux-64-cuda"]

[feature.gpu.dependencies]
cuda-version = ">=12,<13"
pytorch-gpu = "*"

[feature.cpu]
platforms = ["linux-64"]

[feature.cpu.dependencies]
pytorch-cpu = "*"

[environments]
cpu = {features =["cpu"], solve-group = "default"}
default = {features =["gpu"], solve-group = "default"}

[tasks]
server = "uvicorn video_interface.app:app --reload --host 0.0.0.0 --port 8000"
test_video = "python video_terminal/video_terminal.py"

[dependencies]
pillow = ">=10.4.0,<11"
pyyaml = ">=6.0.3,<7"
bert_score = ">=0.3.9,<0.4"
datasets = ">=5.0.0,<6"
dlib = ">=20.0.1,<21"
fastapi = ">=0.139.0,<0.140"
insightface = ">=1.0.1,<2"
ipython = ">=9.15.0,<10"
librosa = ">=0.11.0,<0.12"
matplotlib = ">=3.11.0,<4"
moviepy = ">=2.2.1,<3"
numpy = ">=2.4.6,<3"
openai = ">=2.44.0,<3"
pandas = ">=3.0.3,<4"
plotly = ">=6.8.0,<7"
pydantic = ">=2.13.4,<3"
requests = ">=2.34.2,<3"
pydub = ">=0.25.1,<0.26"
rouge = ">=1.0.1,<2"
scikit-learn = ">=1.9.0,<2"
scipy = ">=1.18.0,<2"
tqdm = ">=4.68.3,<5"
transformers = ">=5.13.0,<6"
webrtcvad = ">=2.0.10,<3"
openai-whisper = ">=20250625,<20250626"
py-opencv = ">=5.0.0,<6"
openai-clip = ">=1.0.1,<2"
av = ">=18.0.0,<19"
onnx = ">=1.22.0,<2"
onnxruntime = ">=1.26.0,<2"
pysoundfile = ">=0.14.0,<0.15"
python-sounddevice = ">=0.5.5, <0.6"

[pypi-dependencies]
kokoro = ">=0.9.4, <0.10"
"harmoni-dev" = { path = ".", editable = true }
sentence-transformers = ">=5.6.0, <6"

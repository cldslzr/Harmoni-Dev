[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harmoni-dev"
version = "0.1.0"
description = "Context-aware conversation framework"
requires-python = ">=3.12"

[tool.setuptools]
py-modules = ["utils", "download_models", "test"]

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "conversation*", "vision*"]